<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 BLE ADC Monitor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            text-align: center;
            padding: 50px 20px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #cccccc;
        }
        .status {
            margin-top: 15px;
            font-weight: bold;
            color: #666;
        }
        .display-box {
            font-size: 48px;
            font-weight: bold;
            color: #28a745;
            margin: 30px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ESP32 ADC Monitor</h2>
    <p>GPIO 34 Real-time Data via BLE</p>
    
    <div class="display-box" id="adcValue">0000</div>
    
    <button id="connectBtn" onclick="connectBLE()">Connect to ESP32</button>
    <div class="status" id="statusText">Status: Disconnected</div>
</div>

<script>
    // Must match the UUIDs in your Arduino code
    const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const CHARACTERISTIC_UUID_TX = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

    let bleDevice = null;
    let gattServer = null;

    async function connectBLE() {
        const statusText = document.getElementById('statusText');
        const connectBtn = document.getElementById('connectBtn');
        const adcValueDisplay = document.getElementById('adcValue');

        try {
            statusText.textContent = "Status: Searching...";
            
            // Request standard Bluetooth device filtering for our custom service
            bleDevice = await navigator.bluetooth.requestDevice({
                filters: [{ name: 'ESP32_ADC_BLE' }],
                optionalServices: [SERVICE_UUID]
            });

            statusText.textContent = "Status: Connecting...";
            bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

            // Connect to GATT Server
            gattServer = await bleDevice.gatt.connect();

            // Get Service
            const service = await gattServer.getPrimaryService(SERVICE_UUID);

            // Get TX Characteristic for notifications
            const characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_TX);

            // Start receiving stream notifications
            await characteristic.startNotifications();
            characteristic.addEventListener('characteristicvaluechanged', handleData);

            statusText.textContent = "Status: Connected";
            statusText.style.color = "#28a745";
            connectBtn.disabled = true;

        } catch (error) {
            console.log("Error: " + error);
            statusText.textContent = "Status: Connection Failed";
            statusText.style.color = "#dc3545";
            connectBtn.disabled = false;
        }
    }

    // Parse the incoming streaming data array back to a string
    function handleData(event) {
        const value = event.target.value;
        let decoder = new TextDecoder('utf-8');
        let strValue = decoder.decode(value);
        
        document.getElementById('adcValue').textContent = strValue;
    }

    function onDisconnected() {
        document.getElementById('statusText').textContent = "Status: Disconnected";
        document.getElementById('statusText').style.color = "#666";
        document.getElementById('connectBtn').disabled = false;
        document.getElementById('adcValue').textContent = "0000";
    }
</script>

</body>
</html>
